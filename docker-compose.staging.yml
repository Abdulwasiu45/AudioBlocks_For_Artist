version: "3.9"

# ── Staging Environment Composition (OPS-03) ──────────────────────────────────
# Targets the AudioBlocks backend testnet environment and Stellar Soroban Testnet.
# Uses the exact same immutable container image promoted from CI (OPS-04).
# ─────────────────────────────────────────────────────────────────────────────

services:
  staging-app:
    image: ${DOCKER_IMAGE:-audioblocks-artist:staging}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: audioblocks-artist-staging
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://api.testnet.audioblocks.io}
      - NEXT_PUBLIC_PRIVY_APP_ID=${NEXT_PUBLIC_PRIVY_APP_ID:-staging-privy-app-id}
      - NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE=${NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      - NEXT_PUBLIC_HORIZON_URL=${NEXT_PUBLIC_HORIZON_URL:-https://horizon-testnet.stellar.org}
      - NEXT_PUBLIC_STELLAR_RPC_URL=${NEXT_PUBLIC_STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      - NEXT_PUBLIC_USE_MOCK_DATA=false
      - NEXT_PUBLIC_BASE_URL=https://staging.artists.audioblocks.io
      - CANONICAL_HOST=staging.artists.audioblocks.io
      - SENTRY_ENVIRONMENT=staging
    env_file:
      - ./app/.env.staging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
